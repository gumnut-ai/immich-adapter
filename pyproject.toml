[project]
name = "immich-adapter"
version = "0.1.0"
description = "FastAPI server that adapts the Immich API to the Gumnut API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.140.0",
    "gumnut-sdk>=0.169.0",
    "pillow>=11",
    "pillow-heif>=1.7.0",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.2",
    "python-socketio>=5.13.0",
    "redis~=8.0",
    "sentry-sdk[fastapi,httpx]>=2.69.0",
    "shortuuid>=1.0.13",
    "stream-zip>=0.0.83",
    "user-agents>=2.2.0",
    # uvicorn 0.44.0 added keepalive pings for the websockets-sansio impl,
    # which is what we run via `--ws websockets-sansio` to avoid the legacy
    # `websockets` shielded-future leak. See docs/references/uvicorn-settings.md.
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
# Supply chain guard: only resolve packages published ≥ 14 days ago.
# Most compromised packages are detected and yanked within 1–2 weeks,
# so this window lets the ecosystem catch problems before we pull them in.
exclude-newer = "14 days"
# First-party SDK publishes frequently; exempt from the cooldown window.
exclude-newer-package = { gumnut-sdk = false }

[dependency-groups]
dev = [
    # Needed by tests/test_lint_docs.py, which imports scripts/lint_docs.py as a
    # module rather than shelling out to `uv run`. The linter itself declares this
    # in its own PEP 723 header; `test_pep723_dependency_matches_test_environment`
    # pins the two declarations together so the duplication cannot drift silently.
    "markdown-it-py>=3,<5",
    # Runs the session and checkpoint Lua scripts in unit tests.
    "fakeredis[lua]>=2.30",
    "pyright>=1.1.403",
    "ruff>=0.16",
    "socksio>=1.0.0",
]

[tool.ruff]
# The standalone PEP 723 scripts declare their own, older `requires-python`
# (lint_docs.py is also kept byte-identical to the photos copy). Format them for
# that floor so py3.14-only syntax, such as PEP 758's unparenthesized
# `except A, B:`, is never written into them.
per-file-target-version = { "scripts/lint_docs.py" = "py311", "scripts/extract-immich-web.py" = "py312", "tools/*.py" = "py312" }

# Enforce ruff's default rule set. Ruff 0.16 widened it from 59 to 413 rules
# but dropped 18 of the earlier defaults (E401, E402, most of E7, F403, F405,
# F406, F722); extend-select keeps those enforced too. A ruff upgrade can change
# the default set, so review new hits when bumping it.
[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F"]
ignore = [
    # Broad catches mark deliberate isolation boundaries: Sentry's before_send,
    # best-effort WebSocket and metrics side effects, cleanup paths, and CLI
    # top-levels. Narrowing them would change which failures propagate.
    "BLE001",
]

# FastAPI declares dependencies and request parameters as call defaults; those
# calls build immutable markers, so they are safe as defaults.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# Tests read logging `extra` fields with getattr(record, "name"); pyright cannot
# see those dynamic LogRecord attributes, so the direct access B009 wants fails
# type-checking.
# Tests also build naive local-capture datetimes, which is how the Gumnut API
# represents a capture time whose zone is unknown (see
# docs/references/asset-field-conversion.md), and parse date-only strings.
"tests/**" = ["B009", "DTZ001", "DTZ007"]

# Ruff 0.16 also started formatting Python code blocks in Markdown by default.
# Doc snippets are often fragments (keyword arguments, partial calls) that it
# rewrites into different code, so keep the formatter on .py files only.
[tool.ruff.format]
exclude = ["*.md"]
