name: zizmor

# Lints .github/workflows/*.yml for supply-chain and template-injection
# anti-patterns.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      # The pin policy itself, so a change that weakens it is audited by
      # the run it governs instead of landing unexercised.
      - ".github/zizmor.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      # The pin policy itself, so a change that weakens it is audited by
      # the run it governs instead of landing unexercised.
      - ".github/zizmor.yml"

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      # zizmor-action defaults to advanced-security: true and uploads a
      # SARIF via github/codeql-action/upload-sarif; these scopes are what
      # that upload requires on private repos.
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
