name: Approval runner validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/approval-runner-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    name: Runner validation (${{ matrix.runner }}, ${{ matrix.sample }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-slim]
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Load the pinned approval regression suite
        uses: actions/checkout@v7.0.1
        with:
          repository: gumnut-ai/automation
          ref: a9db381acd511bdf0e16564a200517df96c3a144
          path: .approval-runtime
          persist-credentials: false
      # Synthetic API fixtures cover real submit/readback logic, never a live review.
      - name: Request, assessment and publication regressions
        run: node --test .approval-runtime/pr-approval/*.test.cjs
      # An empty assessment exercises the composite without API requests or writes.
      - name: Empty assessment
        id: inspect
        uses: gumnut-ai/automation/actions/pr-approval@a9db381acd511bdf0e16564a200517df96c3a144 # zizmor: ignore[ref-version-mismatch]
        with:
          operation: inspect
          bot-login: fixture-reviewer[bot]
          numbers: '[]'
      - name: Verify no-op results
        env:
          ACTIONABLE: ${{ steps.inspect.outputs.actionable }}
          NUMBERS: ${{ steps.inspect.outputs.numbers }}
        run: |
          test "$ACTIONABLE" = false
          test "$NUMBERS" = '[]'
