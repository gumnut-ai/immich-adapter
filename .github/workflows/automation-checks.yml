name: Automation workflow checks
on:
  pull_request:
    paths: ['.agents/daemons/AGENTS.md', '.agents/daemons/dependency-maintenance/**', '.agents/daemons/librarian/**', '.agents/daemons/codebase-maintainer/**', '.node-version', 'scripts/prepare_maintainer_python.sh', '.github/pr-approval/**', '.github/workflows/pr-approval*', '.github/claude-review/**', '.github/workflows/claude-review.yml', '.github/workflows/automation-checks.yml', '.github/librarian/**', '.github/maintainer/**', '.github/workflows/librarian*', '.github/workflows/maintainer*', '.github/dependency-maintenance/**', '.github/workflows/dependency-maintenance*']
  push:
    branches: [main]
    paths: ['.agents/daemons/AGENTS.md', '.agents/daemons/dependency-maintenance/**', '.agents/daemons/librarian/**', '.agents/daemons/codebase-maintainer/**', '.node-version', 'scripts/prepare_maintainer_python.sh', '.github/pr-approval/**', '.github/workflows/pr-approval*', '.github/claude-review/**', '.github/workflows/claude-review.yml', '.github/workflows/automation-checks.yml', '.github/librarian/**', '.github/maintainer/**', '.github/workflows/librarian*', '.github/workflows/maintainer*', '.github/dependency-maintenance/**', '.github/workflows/dependency-maintenance*']
permissions:
  contents: read
jobs:
  review-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned shared daemon automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gumnut-ai/automation
          ref: 187e77e153bd935ee55e56082f4aeea4a27aa67d
          path: .shared-automation
          persist-credentials: false
          sparse-checkout: |
            native-toolchain
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check Claude reviewer admission and tool boundaries
        run: node --test .github/claude-review/*.test.cjs
      - name: Check standing approval policy and publication boundaries
        run: node --test .github/pr-approval/*.test.cjs
      - name: Check native maintenance boundaries
        run: node --test .github/maintainer/native-policy.test.cjs
      - name: Verify daemon workflow regeneration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          compiler="${RUNNER_TEMP}/gh-aw-v0.89.21"
          curl --fail --silent --show-error --location \
            https://github.com/github/gh-aw/releases/download/v0.89.21/linux-amd64 \
            --output "$compiler"
          echo "1c74ff5fc28b1891d32b67f4348a9b7f750946b6d4a721e909187a848868016b  $compiler" | sha256sum --check
          chmod +x "$compiler"
          "$compiler" compile librarian --action-tag v0.89.21 --no-check-update
          "$compiler" compile maintainer --action-tag v0.89.21 --no-check-update
          "$compiler" compile dependency-maintenance --action-tag v0.89.21 --no-check-update
          git diff --exit-code -- .github/workflows/librarian.lock.yml .github/workflows/maintainer.lock.yml .github/workflows/dependency-maintenance.lock.yml .github/aw/actions-lock.json
